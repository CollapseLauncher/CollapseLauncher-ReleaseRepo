name: Sync to GitLab

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:  
        - uses: kujov/gitlab-sync@2255578444d23f254d08592bb8434084d29474d5 # 2.1.0
          with:
            gitlab_url: https://gitlab.com/bagusnl/CollapseLauncher-ReleaseRepo.git
            username: bagusnl
            gitlab_pat: ${{ secrets.GITLAB_PAT }}
            force_push: true
